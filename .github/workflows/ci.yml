name: Build Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'          # Trigger saat push tag, contoh: v1.0.0
  workflow_dispatch:       # Bisa dijalankan manual dari GitHub Actions tab
    inputs:
      version_name:
        description: 'Version name (contoh: 1.0.0)'
        required: false
        default: '1.0.0'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source code ──────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Setup Java (diperlukan Android build tools) ───────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Pre-install Android NDK ───────────────────────────────────
      - name: Pre-install Android NDK
        run: |
          echo "Accepting Android SDK licenses..."
          yes | sdkmanager --licenses || true
          rm -rf $ANDROID_HOME/.downloadIntermediates/ || true
          echo "Pre-installing NDK 27.0.12077973..."
          for i in 1 2 3; do
            echo "Attempt $i to install NDK..."
            yes | sdkmanager --install "ndk;27.0.12077973" && break || sleep 5
          done
          echo "Available NDKs on runner:"
          ls -la $ANDROID_HOME/ndk/ || true

      # ── 4. Setup Flutter ─────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'  # Flutter 3.29.0 membawa Dart 3.7.0
          channel: 'stable'
          cache: false  # nonaktifkan cache untuk menghindari Dart SDK versi lama

      # ── 4. Verifikasi instalasi ───────────────────────────────────────
      - name: Flutter Doctor
        run: flutter doctor -v

      # ── 5. Install dependencies ───────────────────────────────────────
      - name: Flutter Pub Get
        run: flutter pub get

      # ── 6. Analisis kode (opsional, hapus jika ingin skip) ───────────
      - name: Flutter Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true
            
      # ── 7. Build APK release ─────────────────────────────────────────
      - name: Build APK Release
        run: |
          flutter build apk \
            --release \
            --split-per-abi

      # ── 8. Rename APK dengan nama skilloka.apk ────────────────────────
      - name: Rename APKs
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "refs/heads/main" ] || [ "$VERSION" = "main" ]; then
            VERSION="v${{ github.event.inputs.version_name || '1.0.0' }}"
          fi
          mkdir -p release-apk

          # 1. Sediakan file utama dengan nama skilloka.apk (dari build ARM64 optimal)
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-apk/skilloka.apk
          elif [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk release-apk/skilloka.apk
          fi

          # 2. Sediakan juga varian arsitektur untuk artifact/release
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            if [ -f "$apk" ]; then
              ARCH=$(echo "$apk" | grep -oP '(?<=app-).*(?=-release)')
              cp "$apk" "release-apk/skilloka-${VERSION}-${ARCH}.apk"
            fi
          done

          ls -lh release-apk/

      # ── 9. Upload APK sebagai artifact (selalu tersedia) ─────────────
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: release-apk/*.apk
          retention-days: 30

      # ── 10. Buat GitHub Release (hanya saat push tag) ─────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Skilloka ${{ github.ref_name }}"
          body: |
            ## 📦 Skilloka ${{ github.ref_name }}

            ### Download APK
            - **skilloka.apk** → Versi utama siap install untuk HP Android modern (arm64-v8a)
            - **skilloka-${{ github.ref_name }}-arm64-v8a.apk** → HP modern (64-bit)
            - **skilloka-${{ github.ref_name }}-armeabi-v7a.apk** → HP lama (32-bit)
            - **skilloka-${{ github.ref_name }}-x86_64.apk** → Emulator / PC

            ### Backend Server
            - **Production URL**: `https://skilloka.my.id`
            - **API Endpoint**: `https://skilloka.my.id/api`
            - **Media Storage**: `https://skilloka.my.id/storage`

            ### Cara Install
            1. Download `skilloka.apk`
            2. Aktifkan *Install from unknown sources* di pengaturan HP
            3. Buka file APK dan jalankan instalasi
          files: release-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 11. Kirim APK ke Telegram ─────────────────────────────────────
      - name: Send APK to Telegram
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${BOT_TOKEN}" ] || [ -z "${CHAT_ID}" ]; then
            echo "Secrets Telegram belum dikonfigurasi, skip."
            exit 0
          fi

          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "refs/heads/main" ] || [ "$VERSION" = "main" ]; then
            VERSION="v${{ github.event.inputs.version_name || '1.0.0' }}"
          fi

          SHORT_SHA="${GITHUB_SHA:0:7}"
          BUILD_TIME=$(date '+%d %b %Y %H:%M UTC')

          # Kirim file skilloka.apk (di bawah limit 50MB Telegram)
          TARGET_APK="release-apk/skilloka.apk"
          if [ ! -f "$TARGET_APK" ]; then
            TARGET_APK=$(ls release-apk/*.apk | head -n 1)
          fi

          if [ -f "$TARGET_APK" ]; then
            FILE_SIZE=$(du -sh "$TARGET_APK" | cut -f1)
            CAPTION="🚀 <b>Skilloka Mobile APK</b>%0A🏷️ <b>Versi:</b> ${VERSION}%0A📱 <b>File:</b> $(basename "$TARGET_APK") (${FILE_SIZE})%0A🌐 <b>Server:</b> skilloka.my.id (Live)%0A📝 <b>Commit:</b> ${SHORT_SHA}%0A⏰ <b>Waktu Build:</b> ${BUILD_TIME}"

            echo "Mengirim $TARGET_APK ke Telegram..."
            RESPONSE=$(curl -s -o /tmp/tg_response.txt -w "%{http_code}" \
              -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@${TARGET_APK}" \
              -F "caption=${CAPTION}" \
              -F "parse_mode=HTML")

            if [ "$RESPONSE" = "200" ]; then
              echo "✅ Berhasil terkirim ke Telegram: $(basename "$TARGET_APK")"
            else
              echo "❌ Gagal kirim Telegram ($RESPONSE): $(cat /tmp/tg_response.txt)"
            fi
          else
            echo "File APK tidak ditemukan di release-apk/"
          fi